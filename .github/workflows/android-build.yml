name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest
    env:
      # FIX (2026-08-04): GitHub Actions does not allow the `secrets` context inside an
      # `if:` conditional directly ("Unrecognized named-value: 'secrets'" build failure).
      # Secrets must be assigned to env first, then checked via the `env` context in `if:`.
      GOOGLE_SERVICES_JSON_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Write local.properties (CI defaults; overridden by repo secrets if set)
        run: |
          cat > local.properties << EOF
          sdk.dir=${ANDROID_HOME}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          API_BASE_URL=${{ secrets.API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID=${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
          EOF

      # Optional: push notifications for incoming calls (see call/VoiceIdFirebaseMessagingService.kt).
      # Store the *contents* of your real google-services.json, base64-encoded, as the
      # GOOGLE_SERVICES_JSON secret (e.g. `base64 -w0 google-services.json`). Until that
      # secret is set this step is skipped and the build proceeds without Firebase, exactly
      # as before this feature was added — see app/build.gradle.kts's conditional plugin apply.
      - name: Write google-services.json (skipped if secret not set)
        if: ${{ env.GOOGLE_SERVICES_JSON_SECRET != '' }}
        run: echo "$GOOGLE_SERVICES_JSON_SECRET" | base64 -d > app/google-services.json

      - name: Lint
        run: ./gradlew lintDebug --stacktrace
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # TEMPORARY DEBUG STEP - remove after copying the SHA-1 from the logs
      - name: Discover debug signing config and print SHA-1 (TEMPORARY - remove after use)
        continue-on-error: true
        run: |
          set +e

          echo "===== Current working directory ====="
          pwd

          echo ""
          echo "===== Searching entire runner for *.jks / *.keystore files ====="
          KEYSTORES=$(find / -xdev -type f \( -iname "*.jks" -o -iname "*.keystore" \) 2>/dev/null)
          if [ -n "$KEYSTORES" ]; then
            echo "Found the following keystore file(s):"
            echo "$KEYSTORES"
          else
            echo "No *.jks or *.keystore files were found anywhere on the runner."
          fi

          echo ""
          echo "===== Asking Gradle for the actual resolved signing configuration ====="
          echo "(this reflects whatever signingConfig Gradle really used to sign the debug/release APKs,"
          echo " including any auto-generated default debug keystore, without assuming a path)"
          ./gradlew signingReport --stacktrace

          echo ""
          echo "The 'signingReport' output above lists, per build variant, the exact"
          echo "Store path, Alias, and SHA1 fingerprint that Gradle actually used."

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceid-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceid-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
